<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence — UI Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,300..600&family=Inter:wght@300..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════
   LAB CHROME  — the workbench, not the designs.
   Deliberately neutral dark so the phone frames read as objects.
   ════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#111113;color:#e6e6e8;
  font:400 13px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit}

.lab-bar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:14px 24px;
  background:rgba(17,17,19,.86);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid #26262a;
}
.lab-brand{display:flex;align-items:baseline;gap:9px;margin-right:6px}
.lab-brand b{font-family:"Newsreader",serif;font-weight:600;font-size:17px;letter-spacing:-.01em}
.lab-brand span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6f6f78}

.ctl{display:flex;align-items:center;gap:9px}
.ctl > label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#6f6f78}
.seg{display:flex;background:#1c1c20;border:1px solid #2a2a30;border-radius:9px;padding:3px;gap:2px}
.seg button{
  appearance:none;border:0;background:transparent;color:#9a9aa4;
  font:600 12px/1 "Inter",sans-serif;letter-spacing:.01em;
  padding:7px 13px;border-radius:6px;cursor:pointer;transition:background .14s,color .14s;
}
.seg button:hover{color:#d4d4dc}
.seg button[aria-pressed="true"]{background:#35353d;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.lab-hint{margin-left:auto;font-size:11px;color:#5c5c66;letter-spacing:.01em}

/* ── stage ─────────────────────────────────────────────── */
.stage{
  padding:34px 24px 60px;
  display:flex;gap:34px;align-items:flex-start;justify-content:flex-start;
  overflow-x:auto;
  zoom:var(--zoom,.76);
}
.stage.solo{justify-content:center}
.slot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.slot[hidden]{display:none}

.slot-head{width:393px;padding:0 4px}
.slot-name{font-family:"Newsreader",serif;font-size:21px;font-weight:600;letter-spacing:-.01em;color:#f2f2f4}
.slot-tag{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#7a7a85;margin-top:3px}
.slot-note{font-size:12.5px;line-height:1.55;color:#8e8e99;margin-top:9px;max-width:393px}
.slot-note b{color:#c8c8d2;font-weight:600}

/* ── device ────────────────────────────────────────────── */
.device{
  width:393px;height:852px;
  border-radius:56px;
  padding:11px;
  background:linear-gradient(160deg,#3a3a40,#151518 32%,#0c0c0e 62%,#2e2e34);
  box-shadow:0 40px 80px -24px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06),inset 0 0 2px rgba(255,255,255,.14);
  flex:0 0 auto;
}
.viewport{
  position:relative;width:100%;height:100%;
  border-radius:46px;overflow:hidden;
  background:#fff;
  isolation:isolate;
}
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.screen[hidden],.chrome[hidden]{display:none}

/* status bar + home indicator — shared realism, per-variant colors */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 30px 0;
  font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
  letter-spacing:.01em;pointer-events:none;
  color:var(--sb-ink,#000);
}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.sb-bars i{width:3px;background:currentColor;border-radius:1px;display:block}
.sb-bars i:nth-child(1){height:4px}.sb-bars i:nth-child(2){height:6px}
.sb-bars i:nth-child(3){height:8.5px}.sb-bars i:nth-child(4){height:11px}
.sb-wifi{width:15px;height:11px;border-radius:0 0 2px 2px;
  background:radial-gradient(circle at 50% 100%,currentColor 0 32%,transparent 33% 56%,currentColor 57% 72%,transparent 73%)}
.sb-batt{width:25px;height:12px;border:1.4px solid currentColor;border-radius:3.5px;position:relative;opacity:.55}
.sb-batt::after{content:"";position:absolute;inset:1.6px;width:62%;background:currentColor;border-radius:1.5px}
.sb-batt::before{content:"";position:absolute;right:-3.4px;top:3.4px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0;opacity:.5}
.home-ind{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;z-index:40;pointer-events:none;
  background:var(--hi,rgba(0,0,0,.28));
}

/* ════════════════════════════════════════════════════════════
   VARIANT 1 — AURORA
   iOS 26 "Liquid Glass", by the book: glass on CHROME only
   (nav bar, tab bar, controls). Content stays opaque, per HIG.
   Concentric radii: inner = outer − padding.
   ════════════════════════════════════════════════════════════ */
.v-aurora{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",sans-serif;
  --bg:#EFEFF4; --mesh1:rgba(10,132,255,.20); --mesh2:rgba(191,90,242,.16); --mesh3:rgba(48,209,88,.13);
  --surface:#FFFFFF; --surface2:#F2F2F7; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --ink:#000000; --ink2:rgba(60,60,67,.62); --ink3:rgba(60,60,67,.34); --sep:rgba(60,60,67,.13);
  --blue:#007AFF; --green:#28A745; --red:#E5342A; --orange:#D97706;
  --tint-green:rgba(40,167,69,.12); --tint-red:rgba(229,52,42,.11); --tint-orange:rgba(217,119,6,.12);
  --glass:rgba(255,255,255,.62); --glass-brd:rgba(255,255,255,.66); --glass-spec:rgba(255,255,255,.85);
  --shadow:0 10px 34px -10px rgba(0,0,0,.20);
  --sb-ink:#000; --hi:rgba(0,0,0,.3);
  font-family:var(--font);color:var(--ink);
  background:var(--bg);
}
[data-theme="dark"] .v-aurora{
  --bg:#000000; --mesh1:rgba(10,132,255,.30); --mesh2:rgba(191,90,242,.24); --mesh3:rgba(48,209,88,.16);
  --surface:#1C1C1E; --surface2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
  --ink:#FFFFFF; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.34); --sep:rgba(84,84,88,.55);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --tint-green:rgba(48,209,88,.16); --tint-red:rgba(255,69,58,.16); --tint-orange:rgba(255,159,10,.16);
  --glass:rgba(38,38,42,.58); --glass-brd:rgba(255,255,255,.14); --glass-spec:rgba(255,255,255,.30);
  --shadow:0 10px 34px -10px rgba(0,0,0,.7);
  --sb-ink:#fff; --hi:rgba(255,255,255,.4);
}
/* ambient mesh so the glass has something to refract */
.v-aurora .mesh{position:absolute;inset:-12%;z-index:0;pointer-events:none;
  background:
    radial-gradient(46% 34% at 12% 4%,var(--mesh1),transparent 62%),
    radial-gradient(50% 32% at 92% 12%,var(--mesh2),transparent 64%),
    radial-gradient(56% 34% at 74% 92%,var(--mesh3),transparent 66%);
  filter:blur(6px);
}
.v-aurora .body{position:relative;z-index:1;padding:0 0 132px}

/* nav bar — transparent at rest, liquid glass once content slides under it */
.v-aurora .nav{
  position:sticky;top:0;z-index:20;height:54px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
  font-size:17px;font-weight:600;letter-spacing:-.02em;
  color:transparent;transition:color .22s ease,background .22s ease,box-shadow .22s ease;
  background:transparent;
}
.v-aurora .nav.scrolled{
  color:var(--ink);
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 -.5px 0 var(--sep),inset 0 1px 0 var(--glass-spec);
}
.v-aurora .pad{padding:0 20px}
.v-aurora .large-title{font-size:34px;line-height:1.06;font-weight:700;letter-spacing:-.026em;margin:4px 0 0}
.v-aurora .subtitle{font-size:15px;color:var(--ink2);margin-top:5px;letter-spacing:-.01em}

/* section header — iOS grouped-list caption */
.v-aurora .grp-h{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:-.005em;
  padding:0 20px;margin:26px 0 8px;display:flex;align-items:center;justify-content:space-between}
.v-aurora .grp-h em{font-style:normal;color:var(--ink3);font-weight:400}

/* card: outer radius 26, padding 14 → inner radius 12 (concentric) */
.v-aurora .card{
  background:var(--surface);border-radius:26px;margin:0 16px;
  box-shadow:var(--shadow);overflow:hidden;
}
.v-aurora .card.pad14{padding:14px}

/* hero verdict */
.v-aurora .verdict{padding:20px 20px 18px;display:flex;flex-direction:column;gap:2px}
.v-aurora .vpill{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:6px 11px;border-radius:11px;margin-bottom:11px;
}
.v-aurora .vdot{width:7px;height:7px;border-radius:50%;background:currentColor}
.v-aurora .vhead{font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.14}
.v-aurora .vsub{font-size:15px;color:var(--ink2);margin-top:6px;line-height:1.36;letter-spacing:-.01em}
.v-aurora .vsplit{display:flex;gap:8px;margin-top:15px}
.v-aurora .vchip{
  flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px;
}
.v-aurora .vchip b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.v-aurora .vchip span{display:block;font-size:11px;color:var(--ink2);margin-top:3px;letter-spacing:-.005em}

/* schedule rail */
.v-aurora .rail{display:flex;gap:4px;height:44px;position:relative;margin-top:2px}
.v-aurora .seg-blk{
  flex:1;border-radius:11px;background:var(--fill);position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;padding:6px 7px;
}
.v-aurora .seg-blk.present{background:var(--tint-green)}
.v-aurora .seg-blk.nowb{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--blue)}
.v-aurora .seg-blk span{font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-aurora .seg-blk i{position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px;background:currentColor;opacity:.85}
.v-aurora .railmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.v-aurora .railmeta b{font-size:15px;font-weight:600;letter-spacing:-.015em}
.v-aurora .railmeta span{font-size:13px;color:var(--ink2)}
.v-aurora .marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--blue);border-radius:2px;z-index:3}
.v-aurora .marker::before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 2.5px var(--surface)}

/* grouped inset row */
.v-aurora .row{display:flex;align-items:center;gap:13px;padding:13px 14px;position:relative}
.v-aurora .row + .row::after{content:"";position:absolute;top:0;left:73px;right:0;height:.5px;background:var(--sep)}
.v-aurora .row.lead + .row.lead::after{left:74px}
.v-aurora .rtime{width:46px;flex:0 0 46px;text-align:center}
.v-aurora .rtime b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.v-aurora .rtime span{display:block;font-size:11px;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums}
.v-aurora .rmain{flex:1;min-width:0}
.v-aurora .rtitle{font-size:17px;font-weight:600;letter-spacing:-.022em;line-height:1.24;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-aurora .rsub{font-size:13px;color:var(--ink2);margin-top:3px;letter-spacing:-.006em;line-height:1.35}
.v-aurora .rsub.good{color:var(--green)}.v-aurora .rsub.bad{color:var(--red)}.v-aurora .rsub.warn{color:var(--orange)}
.v-aurora .rtrail{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.v-aurora .pct{font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.v-aurora .chev{width:8px;height:8px;border-right:2px solid var(--ink3);border-top:2px solid var(--ink3);
  transform:rotate(45deg);opacity:.9}
.v-aurora .badge{font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 7px;border-radius:7px}
.v-aurora .nowtag{background:var(--blue);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;
  padding:3px 7px;border-radius:6px;text-transform:uppercase}

/* ring */
.v-aurora .ring{position:relative;flex:0 0 auto;display:grid;place-items:center}
.v-aurora .ring .hole{position:absolute;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.v-aurora .ring .hole b{font-size:13px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* big overall stat */
.v-aurora .stat{display:flex;align-items:center;gap:18px;padding:20px}
.v-aurora .statnum{font-size:52px;font-weight:700;letter-spacing:-.045em;line-height:.92;font-variant-numeric:tabular-nums}
.v-aurora .statlbl{font-size:13px;color:var(--ink2);margin-top:7px;letter-spacing:-.005em}
.v-aurora .bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:13px;position:relative}
.v-aurora .bar i{display:block;height:100%;border-radius:4px}
.v-aurora .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.32;border-radius:2px}
.v-aurora .legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.v-aurora .legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.v-aurora .legend em{width:8px;height:8px;border-radius:50%;font-style:normal}
.v-aurora .foot{font-size:12px;color:var(--ink3);padding:14px 22px 0;line-height:1.45}

/* glass segmented control */
.v-aurora .segctl{
  display:flex;margin:16px;padding:3px;border-radius:14px;gap:2px;
  background:var(--glass);border:.5px solid var(--glass-brd);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-spec);
}
.v-aurora .segctl b{
  flex:1;text-align:center;padding:8px 0;border-radius:11px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink2);
}
.v-aurora .segctl b.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.13)}

/* floating liquid-glass tab bar */
.v-aurora .tabbar{
  position:absolute;left:21px;right:21px;bottom:26px;z-index:25;
  height:62px;border-radius:31px;display:flex;align-items:center;
  background:var(--glass);border:.5px solid var(--glass-brd);
  backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);
  box-shadow:inset 0 1px 0 var(--glass-spec),inset 0 -.5px 0 rgba(255,255,255,.18),0 12px 34px -8px rgba(0,0,0,.34);
}
.v-aurora .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3)}
.v-aurora .tab.on{color:var(--blue)}
.v-aurora .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.v-aurora .tab span{font-size:11px;font-weight:600;letter-spacing:-.005em}

/* ════════════════════════════════════════════════════════════
   VARIANT 2 — BROADSHEET
   Your serif, done properly. No card chrome at all: hairline
   rules, a real editorial grid, and numbers set as display type.
   Newsreader (optical sizing) + Inter only for micro-labels.
   ════════════════════════════════════════════════════════════ */
.v-broad{
  --serif:"Newsreader",Times,"Times New Roman",serif;
  --sans:"Inter",-apple-system,sans-serif;
  --paper:#FBFAF6; --ink:#171512; --ink2:#6A6459; --ink3:#9A9287;
  --rule:rgba(23,21,18,.14); --rule2:rgba(23,21,18,.07); --wash:#F2EFE8;
  --sage:#4C7A6A; --clay:#AF4B36; --ochre:#8F7226;
  --sb-ink:#171512; --hi:rgba(23,21,18,.3);
  font-family:var(--serif);background:var(--paper);color:var(--ink);
  font-variant-numeric:lining-nums tabular-nums;
}
[data-theme="dark"] .v-broad{
  --paper:#131211; --ink:#EFEBE3; --ink2:#948C7F; --ink3:#6B655B;
  --rule:rgba(239,235,227,.16); --rule2:rgba(239,235,227,.08); --wash:#1D1B18;
  --sage:#7FAE9C; --clay:#DC7E68; --ochre:#C4A24F;
  --sb-ink:#EFEBE3; --hi:rgba(239,235,227,.4);
}
.v-broad .body{padding:0 0 128px}
.v-broad .pad{padding:0 26px}
.v-broad .lbl{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.20em;
  text-transform:uppercase;color:var(--ink3)}

/* masthead */
.v-broad .mast{
  padding:60px 26px 12px;display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--ink);
}
.v-broad .mast .who{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
.v-broad .mast .when{font-family:var(--sans);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.v-broad .rule-thin{height:1px;background:var(--rule);margin:0 26px}
.v-broad .rule-hair{height:1px;background:var(--rule2)}

/* the lede — the day's one answer, set as display type */
.v-broad .lede{padding:30px 26px 26px;border-bottom:3px double var(--rule)}
.v-broad .kicker{display:flex;align-items:center;gap:9px;margin-bottom:15px}
.v-broad .kicker i{width:9px;height:9px;border-radius:50%;display:block}
.v-broad .kicker span{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.20em;text-transform:uppercase}
.v-broad .headline{font-size:40px;line-height:1.03;font-weight:400;letter-spacing:-.022em;text-wrap:balance}
.v-broad .headline em{font-style:italic;font-weight:400}
.v-broad .deck{font-size:16.5px;line-height:1.48;color:var(--ink2);margin-top:14px;max-width:31ch}
.v-broad .byline{font-family:var(--sans);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);margin-top:18px}

/* section rule + label */
.v-broad .sec{display:flex;align-items:center;gap:12px;padding:0 26px;margin:30px 0 4px}
.v-broad .sec .lbl{white-space:nowrap}
.v-broad .sec .line{flex:1;height:1px;background:var(--rule)}
.v-broad .sec b{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.13em;color:var(--ink3)}

/* timetable ledger */
.v-broad .entry{
  display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:baseline;
  padding:17px 26px;border-bottom:1px solid var(--rule2);position:relative;
}
.v-broad .entry.is-now{background:var(--wash)}
.v-broad .entry.is-now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
.v-broad .entry.past{opacity:.52}
.v-broad .etime{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink2);line-height:1.5}
.v-broad .etime u{display:block;text-decoration:none;color:var(--ink3);font-weight:400}
.v-broad .ename{font-size:21px;line-height:1.16;letter-spacing:-.012em;font-weight:500}
.v-broad .everdict{font-family:var(--sans);font-size:12px;line-height:1.45;color:var(--ink2);margin-top:5px;font-weight:400}
.v-broad .everdict.good{color:var(--sage)}.v-broad .everdict.bad{color:var(--clay)}.v-broad .everdict.warn{color:var(--ochre)}
.v-broad .epct{font-size:25px;font-weight:400;letter-spacing:-.02em;line-height:1;text-align:right}
.v-broad .epct u{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.11em;color:var(--ink3);margin-top:6px;font-weight:500}
.v-broad .nowmark{font-family:var(--sans);font-size:8.5px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink);display:block;margin-bottom:5px}

/* a rule that carries data — the day, drawn as a printed scale */
.v-broad .scale{padding:20px 26px 24px}
.v-broad .scale-track{display:flex;height:34px;gap:1px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);position:relative}
.v-broad .scale-blk{flex:1;position:relative;display:flex;align-items:flex-end;padding:0 0 6px}
.v-broad .scale-blk span{font-family:var(--sans);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.v-broad .scale-blk.filled{background:repeating-linear-gradient(-45deg,var(--rule2) 0 3px,transparent 3px 6px)}
.v-broad .scale-blk.filled span{color:var(--ink2)}

.v-broad .scale-now{position:absolute;top:-5px;bottom:-1px;width:1.5px;background:var(--clay);z-index:2}
.v-broad .scale-now::before{content:"";position:absolute;top:-3px;left:-2.75px;width:7px;height:7px;
  background:var(--clay);border-radius:50%}
.v-broad .scale-cap{display:flex;justify-content:space-between;margin-top:9px}

/* the big number */
.v-broad .figure{padding:26px 26px 22px}
.v-broad .fig-num{font-size:84px;line-height:.84;font-weight:300;letter-spacing:-.05em;display:flex;align-items:flex-start}
.v-broad .fig-num sup{font-size:26px;font-weight:400;letter-spacing:-.02em;margin-top:6px;margin-left:3px}

.v-broad .ledger{height:2px;background:var(--rule);margin-top:11px;position:relative}
.v-broad .ledger i{position:absolute;left:0;top:0;height:100%;background:var(--ink)}
.v-broad .ledger u{position:absolute;top:-5px;height:12px;width:1px;background:var(--clay)}
.v-broad .ledger em{position:absolute;top:11px;transform:translateX(-50%);font-family:var(--sans);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--clay);font-style:normal;white-space:nowrap}

/* tallies */
.v-broad .tally{display:flex;border-top:1px solid var(--rule);margin-top:34px}
.v-broad .tally div{flex:1;padding:15px 0 0}
.v-broad .tally div + div{border-left:1px solid var(--rule2);padding-left:15px}
.v-broad .tally b{display:block;font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1}
.v-broad .tally span{display:block;font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);margin-top:7px}

/* toggle */
.v-broad .tog{display:flex;gap:22px;padding:0 26px;margin-top:22px;border-bottom:1px solid var(--rule)}
.v-broad .tog b{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink3);padding-bottom:10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.v-broad .tog b.on{color:var(--ink);border-bottom-color:var(--ink)}

/* subject line item */
.v-broad .sub{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;
  padding:18px 26px;border-bottom:1px solid var(--rule2)}
.v-broad .sub .nm{font-size:20px;line-height:1.18;letter-spacing:-.012em;font-weight:500}
.v-broad .sub .vd{font-family:var(--sans);font-size:11.5px;color:var(--ink2);margin-top:6px;letter-spacing:-.003em}
.v-broad .sub .vd.good{color:var(--sage)}.v-broad .sub .vd.bad{color:var(--clay)}.v-broad .sub .vd.warn{color:var(--ochre)}

  text-align:right;margin-top:6px}
.v-broad .sub .minibar{grid-column:1/-1;height:1px;background:var(--rule2);margin-top:13px;position:relative}
.v-broad .sub .minibar i{position:absolute;left:0;top:-1px;height:3px}

.v-broad .colophon{padding:26px;color:var(--ink3);font-size:12px;line-height:1.6;font-style:italic;
  border-top:1px solid var(--rule);margin-top:26px}

/* tab bar — printed footer, not a control panel */
.v-broad .tabbar{
  position:absolute;left:0;right:0;bottom:0;height:82px;z-index:25;
  display:flex;align-items:flex-start;padding-top:13px;
  background:var(--paper);border-top:1px solid var(--ink);
}
.v-broad .tab{flex:1;text-align:center;font-family:var(--sans);font-size:10px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);position:relative}
.v-broad .tab.on{color:var(--ink)}
.v-broad .tab.on::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  width:34px;height:2px;background:var(--ink)}

/* ════════════════════════════════════════════════════════════
   VARIANT 3 — BENTO
   Modular tile grid; tile size = importance. Instrument Sans for
   labels, JetBrains Mono for every figure, so numbers never jitter.
   High contrast, no gradients, one inverted tile per screen.
   ════════════════════════════════════════════════════════════ */
.v-bento{
  --sans:"Instrument Sans","Inter",-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --bg:#EDEDEA; --tile:#FFFFFF; --tile2:#F5F5F2; --brd:#DFDFD8; --brd2:#EAEAE4;
  --ink:#121211; --ink2:#67665F; --ink3:#9B9A92;

  --sb-ink:#121211; --hi:rgba(0,0,0,.3);

}
[data-theme="dark"] .v-bento{
  --bg:#0A0A0B; --tile:#151517; --tile2:#1C1C1F; --brd:#26262A; --brd2:#1F1F23;
  --ink:#F4F4F1; --ink2:#94938C; --ink3:#63625C;
  --sage:#83B7A5; --clay:#E08067; --gold:#CBA654; --cobalt:#7FA3DC;
  --sage-w:#16241F; --clay-w:#291815; --gold-w:#241E11;
  --sb-ink:#F4F4F1; --hi:rgba(255,255,255,.4);
}
.v-bento .body{padding:0 0 126px}
.v-bento .hdr{padding:62px 16px 16px;display:flex;align-items:flex-end;justify-content:space-between}
.v-bento .hdr h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1}
.v-bento .hdr .sub{font-size:12.5px;color:var(--ink2);margin-top:7px;letter-spacing:-.01em}
.v-bento .avatar{width:34px;height:34px;border-radius:11px;background:var(--tile);border:1px solid var(--brd);
  display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.02em;flex:0 0 auto}

.v-bento .lbl{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.v-bento .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero" 1}

.v-bento .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:0 16px}
.v-bento .bento + .bento{margin-top:9px}
.v-bento .t{grid-column:span 6;background:var(--tile);border:1px solid var(--brd);border-radius:20px;padding:14px}
.v-bento .t.half{grid-column:span 3}
.v-bento .t.third{grid-column:span 2}

.v-bento .t.flat{background:var(--tile2)}
.v-bento .t.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
[data-theme="dark"] .v-bento .t.ink{color:#0A0A0B}
.v-bento .t.ink .lbl{color:rgba(255,255,255,.55)}
[data-theme="dark"] .v-bento .t.ink .lbl{color:rgba(0,0,0,.5)}
.v-bento .t.dim{opacity:.62}

/* hero verdict tile */
.v-bento .vhero{padding:17px 16px 16px}
.v-bento .vtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.v-bento .vstat{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;padding:5px 9px;border-radius:8px}
.v-bento .vbig{font-size:34px;font-weight:700;letter-spacing:-.042em;line-height:1.04;text-wrap:balance}
.v-bento .vline{font-size:13px;line-height:1.45;margin-top:9px;opacity:.72;max-width:30ch}
.v-bento .vmeter{display:flex;gap:4px;margin-top:16px}
.v-bento .vmeter i{flex:1;height:5px;border-radius:3px;background:currentColor;opacity:.22}
.v-bento .vmeter i.on{opacity:1}

/* stat tile */
.v-bento .sval{font-size:29px;font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:11px}
.v-bento .sval small{font-size:15px;font-weight:600;letter-spacing:-.02em;opacity:.5}
.v-bento .sfoot{font-size:11px;color:var(--ink2);margin-top:6px;letter-spacing:-.005em}

/* ring gauge */
.v-bento .gauge{position:relative;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.v-bento .gauge::after{content:"";position:absolute;border-radius:50%;background:var(--tile)}
.v-bento .t.ink .gauge::after{background:var(--ink)}
.v-bento .gauge b{position:relative;z-index:2;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-weight:700;letter-spacing:-.04em}

/* class tile */
.v-bento .ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.v-bento .ctime{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink2);letter-spacing:-.02em}
.v-bento .cname{font-size:17px;font-weight:700;letter-spacing:-.028em;line-height:1.18;margin-top:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-bento .t.two3 .cname,.v-bento .t.half .cname{font-size:15px;white-space:normal;line-height:1.22}
.v-bento .cverd{font-size:11.5px;line-height:1.4;color:var(--ink2);margin-top:7px;letter-spacing:-.005em}
.v-bento .cverd.good{color:var(--sage)}.v-bento .cverd.bad{color:var(--clay)}.v-bento .cverd.warn{color:var(--gold)}
.v-bento .tag{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 7px;border-radius:7px;white-space:nowrap}
.v-bento .track{height:4px;border-radius:2px;background:var(--brd2);margin-top:12px;overflow:hidden;position:relative}
[data-theme="dark"] .v-bento .track{background:#2A2A2F}
.v-bento .track i{display:block;height:100%;border-radius:2px}
.v-bento .track u{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink3);border-radius:1px}

/* day strip */
.v-bento .strip{display:flex;gap:3px;height:38px;position:relative;margin-top:12px}
.v-bento .sblk{flex:1;border-radius:9px;background:var(--tile2);border:1px solid var(--brd2);
  display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;overflow:hidden}
.v-bento .sblk.done{background:var(--sage-w);border-color:transparent}
.v-bento .sblk.live{border-color:var(--ink);border-width:1.5px}
.v-bento .sblk i{height:3px;border-radius:2px;width:60%}
.v-bento .sblk span{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:-.02em;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-bento .snow{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--clay);z-index:3;border-radius:1px}
.v-bento .snow::before{content:"";position:absolute;top:-3px;left:-2.75px;width:7px;height:7px;border-radius:50%;background:var(--clay)}

/* segmented */
.v-bento .segctl{display:flex;gap:3px;padding:3px;background:var(--tile2);border:1px solid var(--brd);
  border-radius:13px;margin:0 16px 14px}
.v-bento .segctl b{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:11.5px;
  font-weight:700;letter-spacing:-.01em;color:var(--ink2)}
.v-bento .segctl b.on{background:var(--tile);color:var(--ink);border:1px solid var(--brd);padding:7px 0}

.v-bento .sechead{display:flex;align-items:center;gap:9px;padding:0 16px;margin:20px 0 9px}
.v-bento .sechead i{width:6px;height:6px;border-radius:2px}
.v-bento .sechead b{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
.v-bento .sechead u{flex:1;height:1px;background:var(--brd);text-decoration:none}
.v-bento .sechead em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink3)}

.v-bento .srow{display:flex;align-items:center;gap:13px}
.v-bento .smain{flex:1;min-width:0}
.v-bento .foot{padding:18px 18px 0;font-size:11px;color:var(--ink3);line-height:1.5;text-align:center}

/* dock */
.v-bento .tabbar{
  position:absolute;left:16px;right:16px;bottom:24px;z-index:25;height:58px;
  display:flex;gap:4px;padding:5px;border-radius:19px;
  background:var(--tile);border:1px solid var(--brd);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.35);
}
.v-bento .tab{flex:1;border-radius:15px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--ink3)}
.v-bento .tab.on{background:var(--ink);color:var(--bg)}
[data-theme="dark"] .v-bento .tab.on{color:#0A0A0B}
.v-bento .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.v-bento .tab span{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* content scrolls under the status bar; the two opaque variants need a ground */
.v-broad .statusbar{background:var(--paper)}
.v-bento .statusbar{background:var(--bg)}
</style>

  <div class="ctl"><label>Screen</label>

    <div class="seg" id="segShow">

      <button data-show="aurora">Aurora</button>

<div class="stage" id="stage"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   ONE dataset, three renderings. Edit here and all six screens
   change together — that is the point of the lab.
   Numbers are real: skips = attended/0.75 − total, recovery n
   solves (att+n)/(tot+n) ≥ 0.75.
   ══════════════════════════════════════════════════════════════ */
const D = {
  student:'Gurjoban', initials:'G',
  greeting:'Good morning', date:'Monday, September 7', dateShort:'Mon 7 Sep',
  clock:'10:41', updated:'September 5', synced:'today at 09:14',
  now:{ subject:'DBMS', until:'12:00', markerPct:33.5 },
  classes:[
    {name:'Data Structures',              short:'Data Struct.', from:'9:00',  to:'10:00', hrs:1, pct:88.6, att:39, tot:44, state:'done', verdict:'Marked present by your college', short_v:'Present',            tone:'good', c:'#4E7F6F'},
    {name:'Database Management Systems',  short:'DBMS',         from:'10:00', to:'12:00', hrs:2, pct:68.2, att:30, tot:44, state:'now',  verdict:'Attend · 12 more to reach 75%',   short_v:'Attend',             tone:'bad',  c:'#B84F39'},
    {name:'Operating Systems',            short:'Op. Systems',  from:'13:00', to:'14:00', hrs:1, pct:77.3, att:34, tot:44, state:'next', verdict:'Safe to skip · 1 to spare',       short_v:'Skip · 1 spare',     tone:'warn', c:'#9A7B2A'},
    {name:'Computer Networks',            short:'Networks',     from:'14:00', to:'15:00', hrs:1, pct:79.5, att:35, tot:44, state:'next', verdict:'Safe to skip · 2 to spare',       short_v:'Skip · 2 spare',     tone:'good', c:'#3F6AA8'}
  ],
  overall:{ pct:81.6, att:253, tot:310, goal:75, danger:2, edge:2, safe:3 },
  subjects:[
    {name:'Database Management Systems', pct:68.2, att:30, tot:44, status:'danger', verdict:'Attend 12 to recover'},
    {name:'Discrete Mathematics',        pct:74.1, att:40, tot:54, status:'danger', verdict:'Attend 2 to recover'},
    {name:'Operating Systems',           pct:77.3, att:34, tot:44, status:'edge',   verdict:'Can skip 1 class'},
    {name:'Computer Networks',           pct:79.5, att:35, tot:44, status:'edge',   verdict:'Can skip 2 classes'},
    {name:'Data Structures',             pct:88.6, att:39, tot:44, status:'safe',   verdict:'Can skip 8 classes'},
    {name:'Software Engineering',        pct:91.7, att:33, tot:36, status:'safe',   verdict:'Can skip 8 classes'},
    {name:'Technical Communication',     pct:95.5, att:42, tot:44, status:'safe',   verdict:'Can skip 12 classes'}
  ]
};
const byStatus = s => D.subjects.filter(x => x.status === s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* SVG progress ring — shared by the variants that want one */
function ring(p, size, sw, color, inner, track){
  const r=(size-sw)/2, C=2*Math.PI*r, off=C*(1-Math.min(p,100)/100);
  return `<span class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track||'var(--fill)'}" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
              stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>${inner||''}</span>`;
}
const ICONS = {
  today:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  subjects:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"/></svg>',
  planner:'<svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3.5L20 6"/><path d="M4 21h16"/></svg>'
};

/* ══════════════════ VARIANT 1 · AURORA ══════════════════ */
const aurora = {
  tabbar(active){
    const t=[['today','Today'],['subjects','Subjects'],['planner','Planner']];
    return `<div class="tabbar">${t.map(([k,l])=>
      `<div class="tab${k===active?' on':''}">${ICONS[k]}<span>${l}</span></div>`).join('')}</div>`;
  },
  home(){
    const rows = D.classes.map(c=>{
      const tone = c.tone==='good'?'good':c.tone==='bad'?'bad':'warn';
      const col  = c.tone==='good'?'var(--green)':c.tone==='bad'?'var(--red)':'var(--orange)';
      return `<div class="row lead"${c.state==='done'?' style="opacity:.55"':''}>
        <div class="rtime"><b>${c.from}</b><span>${c.hrs} hr</span></div>
        <div class="rmain">
          ${c.state==='now'?'<span class="nowtag">Now</span>':''}
          <div class="rtitle">${esc(c.name)}</div>
          <div class="rsub ${tone}">${esc(c.verdict)}</div>
        </div>
        <div class="rtrail"><span class="pct" style="color:${col}">${c.pct.toFixed(0)}%</span><i class="chev"></i></div>
      </div>`;
    }).join('');

    const blocks = D.classes.map(c=>{
      const cls = c.state==='done' ? ' present' : c.state==='now' ? ' nowb' : '';

    return `<div class="mesh"></div><div class="body">
      <div class="nav">Today</div>
      <div class="pad">
        <h1 class="large-title">Today</h1>
        <div class="subtitle">${D.greeting}, ${D.student} · ${D.date}</div>
      </div>

      <div class="grp-h">The answer</div>
      <div class="card"><div class="verdict">
        <span class="vpill" style="background:var(--tint-orange);color:var(--orange)"><i class="vdot"></i>Partial day</span>
        <div class="vhead">Skip two, show up for&nbsp;one.</div>
        <div class="vsub">DBMS is under your 75% goal, so missing it today costs you. Operating Systems and Networks both have room.</div>
        <div class="vsplit">
          <div class="vchip"><b>2</b><span>safe to skip</span></div>
          <div class="vchip"><b>1</b><span>must attend</span></div>

        </div>
      </div></div>

      <div class="grp-h">Your day <em>4 classes</em></div>
      <div class="card pad14">
        <div class="railmeta"><b>${D.now.subject} until ${D.now.until}</b><span>Next · 1:00 PM</span></div>
        <div class="rail">${blocks}<span class="marker" style="left:${D.now.markerPct}%"></span></div>
      </div>

      <div class="grp-h">Schedule</div>
      <div class="card">${rows}</div>

      <div class="foot">Read from your college register, ${D.synced}. Nothing here is marked by hand.</div>

  },
  attendance(){
    const group = (title, status, color) => {
      const list = byStatus(status);
      if(!list.length) return '';
      return `<div class="grp-h">${title} <em>${list.length}</em></div>
      <div class="card">${list.map(s=>`
        <div class="row">
          ${ring(s.pct,44,3.5,color,`<span class="hole" style="width:36px;height:36px"><b style="color:${color}">${Math.round(s.pct)}</b></span>`)}
          <div class="rmain">
            <div class="rtitle">${esc(s.name)}</div>

        </div>`).join('')}</div>`;
    };
    const o=D.overall;
    return `<div class="mesh"></div><div class="body">
      <div class="nav">Attendance</div>
      <div class="pad">
        <h1 class="large-title">Attendance</h1>
        <div class="subtitle">7 subjects · updated through ${D.updated}</div>

      <div class="segctl"><b class="on">Subjects</b><b>Heatmap</b></div>

      <div class="card">
        <div class="stat">
          ${ring(o.pct,96,9,'var(--green)',`<span class="hole" style="width:78px;height:78px"><b style="font-size:23px">${o.pct}%</b></span>`)}
          <div style="flex:1;min-width:0">

            <div class="statlbl">${o.att} of ${o.tot} hours counted<br>Goal ${o.goal}% · ${(o.pct-o.goal).toFixed(1)} points clear</div>
          </div>

          <div class="bar"><i style="width:${o.pct}%;background:var(--green)"></i><u style="left:${o.goal}%"></u></div>
          <div class="legend">
            <div><em style="background:var(--red)"></em>${o.danger} below goal</div>
            <div><em style="background:var(--orange)"></em>${o.edge} on edge</div>

      ${group('Borderline','edge','var(--orange)')}
      ${group('Safe','safe','var(--green)')}

};

/* ══════════════════ VARIANT 2 · BROADSHEET ══════════════════ */
const broad = {
  mast(){ return `<div class="mast"><span class="who">Presence</span><span class="when">${D.dateShort} · ${D.clock}</span></div>`; },
  tabbar(active){
    const t=[['today','Today'],['subjects','Subjects'],['planner','Planner']];
    return `<div class="tabbar">${t.map(([k,l])=>
      `<div class="tab${k===active?' on':''}">${l}</div>`).join('')}</div>`;
  },
  home(){
    const entries = D.classes.map(c=>{
      const cls = c.state==='now' ? ' is-now' : c.state==='done' ? ' past' : '';
      const tone = c.tone==='good'?'good':c.tone==='bad'?'bad':'warn';
      return `<div class="entry${cls}">
        <div class="etime">${c.from}<u>${c.to}</u></div>
        <div>
          ${c.state==='now'?'<span class="nowmark">In progress</span>':''}
          <div class="ename">${esc(c.name)}</div>
          <div class="everdict ${tone}">${esc(c.verdict)}</div>
        </div>
        <div class="epct">${c.pct.toFixed(1)}<u>attended</u></div>
      </div>`;
    }).join('');

    const blocks = D.classes.map(c=>
      `<div class="scale-blk${c.state==='done'?' filled':''}"><span>${esc(c.short)}</span></div>`).join('');

    return `<div class="body">
      ${broad.mast()}
      <div class="lede">
        <div class="kicker"><i style="background:var(--ochre)"></i><span>Partial day</span></div>
        <h1 class="headline">Two are safe to miss.<br><em>One is not.</em></h1>
        <p class="deck">Database Management Systems sits at 68.2% — twelve classes short of your goal. Operating Systems and Networks both have room to spare.</p>
        <div class="byline">Read from the college register · ${D.synced}</div>
      </div>

      <div class="scale">
        <div class="sec" style="padding:0;margin:0 0 12px"><span class="lbl">The day</span><span class="line"></span><b>4 classes · 5 hours</b></div>
        <div class="scale-track">${blocks}<span class="scale-now" style="left:${D.now.markerPct}%"></span></div>
        <div class="scale-cap"><span class="lbl">9:00</span><span class="lbl">Now · ${D.clock}</span><span class="lbl">15:00</span></div>
      </div>

      <div class="sec"><span class="lbl">Class by class</span><span class="line"></span></div>
      ${entries}

      <div class="colophon">Every figure on this page is your college’s own register, last read ${D.synced}. Presence never marks a class for you.</div>

  attendance(){
    const o=D.overall;
    const colour = s => s==='danger'?'var(--clay)':s==='edge'?'var(--ochre)':'var(--sage)';
    const tone   = s => s==='danger'?'bad':s==='edge'?'warn':'good';
    const group = (title, status) => {
      const list = byStatus(status);
      if(!list.length) return '';
      return `<div class="sec"><span class="lbl">${title}</span><span class="line"></span><b>${list.length}</b></div>
      ${list.map(s=>`<div class="sub">
        <div>
          <div class="nm">${esc(s.name)}</div>
          <div class="vd ${tone(status)}">${esc(s.verdict)}</div>
        </div>
        <div><div class="pc">${s.pct.toFixed(1)}</div><div class="ct">${s.att} / ${s.tot} hrs</div></div>
        <div class="minibar"><i style="width:${s.pct}%;background:${colour(status)}"></i></div>
      </div>`).join('')}`;
    };
    return `<div class="body">
      ${broad.mast()}
      <div class="tog"><b class="on">Subjects</b><b>Heatmap</b></div>

};

/* ══════════════════ VARIANT 3 · BENTO ══════════════════ */
function gauge(p,size,thick,color,fs,hole){
  return `<span class="gauge" style="width:${size}px;height:${size}px;
    background:conic-gradient(${color} ${p}%, var(--brd) 0)">
    <span style="position:absolute;inset:${thick}px;border-radius:50%;background:${hole||'var(--tile)'}"></span>
    <b style="font-size:${fs}px">${p.toFixed(1)}</b></span>`;
}
const bento = {
  tabbar(active){
    const t=[['today','Today'],['subjects','Subjects'],['planner','Planner']];
    return `<div class="tabbar">${t.map(([k,l])=>
      `<div class="tab${k===active?' on':''}">${ICONS[k]}<span>${l}</span></div>`).join('')}</div>`;
  },
  home(){
    const nowC = D.classes.find(x=>x.state==='now');
    const done = D.classes.filter(x=>x.state==='done');
    const next = D.classes.filter(x=>x.state==='next');
    const col  = t => t==='good'?'var(--sage)':t==='bad'?'var(--clay)':'var(--gold)';

    const strip = D.classes.map(x=>{
      const k = x.state==='done'?' done':x.state==='now'?' live':'';
      return `<div class="sblk${k}"><i style="background:${x.c}"></i><span>${esc(x.short)}</span></div>`;
    }).join('');

    const half = next.map(x=>`
      <div class="t half">
        <span class="ctime">${x.from}–${x.to}</span>
        <div class="cname">${esc(x.name)}</div>
        <div class="cverd ${x.tone==='good'?'good':'warn'}">${esc(x.short_v)}</div>
        <div class="track"><i style="width:${x.pct}%;background:${col(x.tone)}"></i><u style="left:75%"></u></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:9px">
          <span class="lbl">${x.hrs} hr</span>
          <span class="num" style="font-size:13px;font-weight:700;letter-spacing:-.04em">${x.pct.toFixed(1)}%</span>
        </div>
      </div>`).join('');

    return `<div class="body">
      <div class="hdr">
        <div><h1>Today</h1><div class="sub">${D.date} · ${D.greeting}, ${D.student}</div></div>
        <div class="avatar">${D.initials}</div>
      </div>

      <div class="bento">
        <div class="t ink" style="padding:17px 16px 15px">
          <div class="vtop">
            <span class="lbl">The answer</span>
            <span class="vstat" style="background:var(--gold);color:#fff">Partial day</span>
          </div>
          <div class="vbig">Skip two.<br>Show up for one.</div>
          <div class="vline">DBMS is twelve classes short of your goal. The other two have room to spare.</div>
          <div style="display:flex;margin-top:19px;align-items:flex-end">
            <div style="flex:1"><b class="num" style="font-size:23px;font-weight:700;letter-spacing:-.05em">2</b>
              <div class="lbl" style="margin-top:4px">Safe to skip</div></div>
            <div style="flex:1;border-left:1px solid rgba(255,255,255,.16);padding-left:13px">
              <b class="num" style="font-size:23px;font-weight:700;letter-spacing:-.05em">1</b>
              <div class="lbl" style="margin-top:4px">Must attend</div></div>
            <div style="flex:1;border-left:1px solid rgba(255,255,255,.16);padding-left:13px">
              <b class="num" style="font-size:23px;font-weight:700;letter-spacing:-.05em">5</b>
              <div class="lbl" style="margin-top:4px">Hours</div></div>
          </div>
        </div>

        <div class="t">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="lbl">Your day</span>
            <span class="num" style="font-size:10px;color:var(--ink3);letter-spacing:-.02em">9:00 → 15:00 · NOW ${D.clock}</span>
          </div>
          <div class="strip">${strip}<span class="snow" style="left:${D.now.markerPct}%"></span></div>
        </div>

        <div class="t">
          <div class="ctop">
            <div style="min-width:0">
              <span class="ctime">${nowC.from}–${nowC.to} · ${nowC.hrs} hr</span>
              <div class="cname">${esc(nowC.name)}</div>
            </div>
            <span class="tag" style="background:var(--ink);color:var(--bg)">Now</span>
          </div>
          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:11px">
            <div class="cverd bad" style="margin:0">${esc(nowC.verdict)}</div>
            <div class="num" style="font-size:27px;font-weight:700;letter-spacing:-.05em;color:var(--clay);line-height:1">${nowC.pct.toFixed(1)}%</div>
          </div>
          <div class="track"><i style="width:${nowC.pct}%;background:var(--clay)"></i><u style="left:75%"></u></div>
        </div>

        ${half}

        ${done.map(x=>`<div class="t flat dim">
          <div class="srow">
            <span class="tag" style="background:var(--sage-w);color:var(--sage)">Present</span>
            <div class="smain"><div style="font-size:14px;font-weight:700;letter-spacing:-.025em">${esc(x.name)}</div></div>
            <span class="num" style="font-size:12px;color:var(--ink2)">${x.from} · ${x.pct.toFixed(1)}%</span>
          </div></div>`).join('')}
      </div>

      <div class="foot">College register, read ${D.synced}</div>
    </div>`;
  },
  attendance(){
    const o=D.overall;
    const col = s => s==='danger'?'var(--clay)':s==='edge'?'var(--gold)':'var(--sage)';
    const tone= s => s==='danger'?'bad':s==='edge'?'warn':'good';

    const bigTile = s => `<div class="t">
      <div class="srow">
        ${gauge(s.pct,58,7,col(s.status),12)}
        <div class="smain">
          <div class="cname" style="margin-top:0">${esc(s.name)}</div>
          <div class="cverd ${tone(s.status)}">${esc(s.verdict)}</div>
        </div>
        <span class="num" style="font-size:11px;color:var(--ink3)">${s.att}/${s.tot}</span>
      </div>
      <div class="track"><i style="width:${s.pct}%;background:${col(s.status)}"></i><u style="left:75%"></u></div>
    </div>`;

    const smallTile = s => `<div class="t half">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="num" style="font-size:20px;font-weight:700;letter-spacing:-.05em;color:${col(s.status)}">${s.pct.toFixed(1)}</span>
        <span class="num" style="font-size:10px;color:var(--ink3)">${s.att}/${s.tot}</span>
      </div>
      <div class="cname" style="font-size:14px;margin-top:7px;white-space:normal;line-height:1.25;min-height:35px">${esc(s.name)}</div>
      <div class="track" style="margin-top:9px"><i style="width:${s.pct}%;background:${col(s.status)}"></i><u style="left:75%"></u></div>
      <div class="cverd ${tone(s.status)}" style="margin-top:9px;font-size:11px">${esc(s.verdict)}</div>
    </div>`;

    // odd tile out goes full-width, so a section never ends on a lonely half
    const tiles = list => list.map((s,i)=> (list.length%2 && i===list.length-1) ? bigTile(s) : smallTile(s)).join('');
    const sec = (t,c,n) => `<div class="sechead"><i style="background:${c}"></i><b>${t}</b><u></u><em>${n}</em></div>`;

    return `<div class="body">
      <div class="hdr">
        <div><h1>Attendance</h1><div class="sub">7 subjects · updated through ${D.updated}</div></div>
        <div class="avatar">${D.initials}</div>
      </div>
      <div class="segctl"><b class="on">Subjects</b><b>Heatmap</b></div>

      <div class="bento">
        <div class="t ink" style="padding:16px">
          <div class="srow" style="gap:17px">
            ${gauge(o.pct,96,10,'var(--sage)',20,'var(--ink)')}
            <div class="smain">
              <div class="lbl">Overall</div>
              <div style="font-size:19px;font-weight:700;letter-spacing:-.035em;margin-top:7px">Above goal</div>
              <div class="num" style="font-size:12px;opacity:.7;margin-top:7px;letter-spacing:-.02em">${o.att} / ${o.tot} HOURS</div>
              <div class="num" style="font-size:12px;opacity:.7;margin-top:3px;letter-spacing:-.02em">GOAL ${o.goal}% · +${(o.pct-o.goal).toFixed(1)}</div>
            </div>
          </div>
        </div>

        <div class="t third" style="padding:12px"><div class="lbl">Below goal</div>
          <div class="sval" style="color:var(--clay)">${o.danger}</div></div>
        <div class="t third" style="padding:12px"><div class="lbl">On edge</div>
          <div class="sval" style="color:var(--gold)">${o.edge}</div></div>
        <div class="t third" style="padding:12px"><div class="lbl">Safe</div>
          <div class="sval" style="color:var(--sage)">${o.safe}</div></div>
      </div>

      ${sec('Needs attention','var(--clay)',o.danger)}
      <div class="bento">${byStatus('danger').map(bigTile).join('')}</div>
      ${sec('Borderline','var(--gold)',o.edge)}
      <div class="bento">${tiles(byStatus('edge'))}</div>
      ${sec('Safe','var(--sage)',o.safe)}
      <div class="bento">${tiles(byStatus('safe'))}</div>

      <div class="foot">Hours counted the way your college counts them.</div>
    </div>`;
  }
};

/* ══════════════════ LAB WIRING ══════════════════ */
const VARIANTS = [
  {id:'aurora', cls:'v-aurora', name:'Aurora', r:aurora,
   tag:'Liquid Glass · iOS 26 native',
   note:'What Apple actually ships. Glass on the <b>chrome only</b> — nav bar and tab bar refract; content cards stay opaque, which is the HIG rule people break. Grouped inset lists, concentric radii (26 outer − 14 pad = 12 inner), SF Pro at 34/17/15/13, 44pt targets. <b>Safest bet:</b> instantly familiar, ages with the OS.'},
  {id:'broad', cls:'v-broad', name:'Broadsheet', r:broad,
   tag:'Editorial serif · your brand, set properly',
   note:'Your serif, but as typography instead of decoration. <b>Zero cards</b> — hairline rules, a real editorial grid, and the percentage set as display type at 84px. This is the "premium, calm, not-a-template" direction, and the only one that could not be mistaken for another attendance app.'},
  {id:'bento', cls:'v-bento', name:'Bento', r:bento,
   tag:'Modular tiles · data-first',
   note:'Tile size = importance. One inverted tile carries the verdict, everything else is a module you can scan in a second. Instrument Sans labels, <b>JetBrains Mono for every figure</b> so numbers never jitter when they update. Densest of the three; best if you keep adding data.'}
];

const stage = document.getElementById('stage');
const sbRight = '<span class="sb-right"><span class="sb-bars"><i></i><i></i><i></i><i></i></span><span class="sb-wifi"></span><span class="sb-batt"></span></span>';

stage.innerHTML = VARIANTS.map(v=>`
  <div class="slot" data-id="${v.id}">
    <div class="slot-head">
      <div class="slot-name">${v.name}</div>
      <div class="slot-tag">${v.tag}</div>
    </div>
    <div class="device"><div class="viewport ${v.cls}">
      <div class="statusbar"><span>${D.clock}</span>${sbRight}</div>
      <div class="screen" data-s="home">${v.r.home()}</div>
      <div class="screen" data-s="attendance" hidden>${v.r.attendance()}</div>
      <div class="chrome" data-s="home">${v.r.tabbar('today')}</div>
      <div class="chrome" data-s="attendance" hidden>${v.r.tabbar('subjects')}</div>
      <div class="home-ind"></div>
    </div></div>
    <div class="slot-head slot-note">${v.note}</div>
  </div>`).join('');

/* iOS nav bars go glass only once content slides under them */
stage.querySelectorAll('.v-aurora .screen').forEach(sc=>{
  const nav = sc.querySelector('.nav');
  if(!nav) return;
  sc.addEventListener('scroll', () => nav.classList.toggle('scrolled', sc.scrollTop > 34), {passive:true});
});

function press(seg, fn){
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    [...seg.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset);
  });
}
press(document.getElementById('segScreen'), d => {
  document.body.dataset.screen = d.screen;
  stage.querySelectorAll('.screen, .chrome').forEach(s => { s.hidden = s.dataset.s !== d.screen; s.scrollTop = 0; });
  stage.querySelectorAll('.nav').forEach(n => n.classList.remove('scrolled'));
});
press(document.getElementById('segTheme'), d => { document.body.dataset.theme = d.theme; });
press(document.getElementById('segShow'),  d => {
  stage.classList.toggle('solo', d.show !== 'all');
  stage.querySelectorAll('.slot').forEach(s => { s.hidden = d.show !== 'all' && s.dataset.id !== d.show; });
});
press(document.getElementById('segZoom'),  d => { stage.style.setProperty('--zoom', d.zoom); });
</script>
