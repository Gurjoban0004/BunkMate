<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presence — Pastel UI Lab</title>
  <style>
    :root {
      --ink: #29253d;
      --muted: #716d82;
      --line: #e9e7ee;
      --surface: #fff;
      --background: #f9f8fc;
      --accent: #6559a8;
      --accent-soft: #e9e5fb;
      --live-ink: #423c76;
      --mint: #e0f3e9;
      --mint-ink: #27644a;
      --peach: #ffe9df;
      --peach-ink: #9b5438;
      --rose: #fae6ed;
      --rose-ink: #9a4d69;
      --shadow: 0 10px 25px rgba(83, 71, 124, .08);
    }
    [data-palette="meadow"] {
      --accent: #397b68; --accent-soft: #ddf1e9; --live-ink: #275b4e;
      --background: #f8fbfa; --shadow: 0 10px 25px rgba(47, 106, 86, .08);
    }
    [data-palette="sky"] {
      --accent: #4d71a5; --accent-soft: #e3edfc; --live-ink: #34547f;
      --background: #f8faff; --shadow: 0 10px 25px rgba(57, 88, 135, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #15151a; color: #f5f5f6;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid #9dbafd; outline-offset: 3px; }
    .lab-bar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
      padding: 14px max(20px, calc((100vw - 1100px) / 2));
      border-bottom: 1px solid #2b2b31; background: rgba(21,21,26,.88); backdrop-filter: blur(16px);
    }
    .lab-brand { margin-right: auto; white-space: nowrap; }
    .lab-brand b { font-size: 17px; letter-spacing: -.03em; }
    .lab-brand small { margin-left: 8px; color: #94949c; font-size: 11px; }
    .controls { display: flex; gap: 3px; padding: 3px; border: 1px solid #393940; border-radius: 9px; background: #202026; }
    .controls button { padding: 7px 10px; border: 0; border-radius: 6px; background: none; color: #aaaab1; cursor: pointer; font-size: 12px; font-weight: 600; }
    .controls button[aria-pressed="true"] { background: #41414a; color: #fff; }
    .lab-hint { max-width: 285px; margin: 0; color: #92929a; font-size: 12px; }
    .stage { display: flex; justify-content: center; padding: 40px 24px 72px; }
    .concept { width: 393px; }
    .concept-note { padding: 0 4px 18px; }
    .concept-note h1 { margin: 0 0 5px; font-size: 19px; letter-spacing: -.03em; }
    .concept-note p { margin: 0; color: #aaaab2; font-size: 12px; line-height: 1.5; }

    .phone {
      width: 393px; height: 852px; overflow: hidden; padding: 10px; border-radius: 53px;
      background: linear-gradient(145deg,#4d4d55,#15151a 23%,#111116 79%,#3b3b43);
      box-shadow: 0 34px 72px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .screen { position: relative; height: 100%; overflow: hidden; border-radius: 44px; background: var(--background); color: var(--ink); }
    .status {
      position: absolute; z-index: 4; inset: 0 0 auto; height: 54px; display: flex; justify-content: space-between;
      align-items: center; padding: 17px 29px 0; color: var(--ink); font-size: 15px; font-weight: 650; pointer-events: none;
    }
    .status-right { font-size: 12px; letter-spacing: 1px; }
    .app { height: 100%; overflow-y: auto; padding: 0 16px 106px; scrollbar-width: none; }
    .app::-webkit-scrollbar { display: none; }
    .page[hidden] { display: none; }
    .top {
      display: flex; align-items: flex-start; justify-content: space-between; padding: 68px 8px 26px;
    }
    .top p { margin: 0; color: var(--muted); font-size: 14px; }
    .top h2 { margin: 4px 0 0; color: var(--ink); font-size: 30px; letter-spacing: -.045em; line-height: 1.06; }
    .avatar {
      width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--rose); color: var(--rose-ink);
      cursor: pointer; font-size: 13px; font-weight: 700;
    }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .live-card {
      padding: 20px; border: 0; border-radius: 16px; background: var(--accent-soft); color: var(--live-ink); box-shadow: var(--shadow);
    }
    .live-card__head { display: flex; align-items: center; justify-content: space-between; }
    .live-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--live-ink); font-size: 11px; font-weight: 750; letter-spacing: .05em; }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .live-card__time { color: var(--live-ink); font-size: 12px; font-weight: 650; }
    .live-card h3 { margin: 15px 0 4px; font-size: 24px; letter-spacing: -.035em; line-height: 1.13; }
    .live-card p { margin: 0; color: color-mix(in srgb, var(--live-ink) 76%, white); font-size: 13px; }
    .live-card__bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
    .room { color: var(--live-ink); font-size: 12px; font-weight: 650; }
    .mark-present { min-height: 40px; padding: 0 13px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; font-size: 12px; font-weight: 700; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin: 28px 8px 11px; }
    .section-heading h3 { margin: 0; font-size: 16px; letter-spacing: -.018em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .class-tile { min-height: 138px; padding: 16px; border: 0; border-radius: 15px; text-align: left; cursor: pointer; }
    .class-tile.mint { background: var(--mint); color: var(--mint-ink); }
    .class-tile.peach { background: var(--peach); color: var(--peach-ink); }
    .class-tile .tile-time { display: block; font-size: 12px; font-weight: 700; }
    .class-tile .tile-name { display: block; margin-top: 31px; font-size: 15px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    .class-tile .tile-room { display: block; margin-top: 5px; font-size: 11px; opacity: .78; }
    .snapshot {
      display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin-top: 12px; padding: 17px 18px;
      border: 1px solid var(--line); border-radius: 15px; background: var(--surface);
    }
    .snapshot p { margin: 0; color: var(--muted); font-size: 12px; }
    .snapshot b { display: block; margin-top: 4px; font-size: 18px; letter-spacing: -.03em; }
    .snapshot span { color: var(--mint-ink); font-size: 12px; font-weight: 700; }

    .attendance-top { padding: 70px 8px 24px; }
    .back { min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 15px; font-weight: 650; }
    .attendance-top h2 { margin: 10px 0 4px; font-size: 30px; letter-spacing: -.045em; }
    .attendance-top p { margin: 0; color: var(--muted); font-size: 14px; }
    .overall {
      display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 20px; border-radius: 16px; background: var(--mint); color: var(--mint-ink);
    }
    .overall small { font-size: 12px; font-weight: 650; }
    .overall strong { display: block; margin-top: 5px; font-size: 43px; letter-spacing: -.065em; line-height: .92; font-variant-numeric: tabular-nums; }
    .overall__safe { align-self: end; padding-bottom: 4px; font-size: 12px; font-weight: 750; }
    .attendance-meta { display: flex; justify-content: space-between; margin: 9px 4px 0; color: var(--muted); font-size: 12px; }
    .attendance-list { margin-top: 21px; border-top: 1px solid var(--line); }
    .attendance-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 74px; padding: 13px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left; cursor: pointer; }
    .subject-dot { width: 11px; height: 11px; border-radius: 4px; flex: 0 0 auto; }.subject-dot.mint { background: #afdcc4; }.subject-dot.lilac { background: #c8c1ee; }.subject-dot.peach { background: #f7c3ae; }.subject-dot.rose { background: #efbed0; }
    .subject-name { flex: 1; min-width: 0; }.subject-name b { display: block; font-size: 15px; letter-spacing: -.015em; }.subject-name span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .rate { text-align: right; font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; }.rate small { display: block; margin-top: 3px; color: var(--mint-ink); font-size: 11px; font-weight: 650; }.rate.risk { color: var(--peach-ink); }.rate.risk small { color: var(--peach-ink); }
    .tabbar {
      position: absolute; z-index: 3; left: 16px; right: 16px; bottom: 22px; display: flex; height: 64px; padding: 4px;
      border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.93); box-shadow: 0 9px 22px rgba(65,53,99,.12); backdrop-filter: blur(18px);
    }
    .tabbar button { flex: 1; border: 0; border-radius: 12px; background: none; color: var(--muted); cursor: pointer; font-size: 10px; font-weight: 650; }
    .tabbar button.active { background: var(--accent-soft); color: var(--accent); }
    .home-indicator { position: absolute; z-index: 4; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 4px; transform: translateX(-50%); background: rgba(0,0,0,.3); }
    .sheet {
      position: absolute; z-index: 8; inset: auto 0 0; display: none; padding: 13px 20px 40px; border-radius: 20px 20px 0 0;
      background: var(--surface); box-shadow: 0 -14px 36px rgba(54,45,76,.17);
    }
    .sheet.open { display: block; }.grab { width: 36px; height: 4px; margin: 0 auto 17px; border-radius: 3px; background: var(--line); }
    .sheet h3 { margin: 0; font-size: 19px; letter-spacing: -.025em; }.sheet p { margin: 6px 0 16px; color: var(--muted); font-size: 13px; }
    .sheet-row { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .sheet button { width: 100%; min-height: 46px; margin-top: 15px; border: 0; border-radius: 11px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 700; }
    @media (prefers-reduced-motion: no-preference) { .class-tile, .attendance-row, .mark-present { transition: transform 160ms ease, filter 160ms ease; }.class-tile:active, .attendance-row:active, .mark-present:active { transform: scale(.985); filter: brightness(.97); } }
    @media (max-width: 650px) { .lab-bar { padding: 11px 14px; gap: 7px; }.lab-brand small, .lab-hint { display: none; }.controls button { padding: 7px 8px; }.stage { justify-content: flex-start; padding: 24px 16px 50px; } }
  </style>
</head>
<body>
  <header class="lab-bar">
    <div class="lab-brand"><b>Presence</b><small>pastel / bento test</small></div>
    <div class="controls" aria-label="Screen"><button data-page="home" aria-pressed="true">Today</button><button data-page="attendance" aria-pressed="false">Attendance</button></div>
    <div class="controls" aria-label="Pastel palette"><button data-palette="lilac" aria-pressed="true">Lilac</button><button data-palette="meadow" aria-pressed="false">Meadow</button><button data-palette="sky" aria-pressed="false">Sky</button></div>
    <p class="lab-hint">One relaxed system. Swap pastel palettes without changing the layout.</p>
  </header>
  <main class="stage">
    <section class="concept">
      <div class="concept-note"><h1>Minimal pastel / bento home</h1><p>Only the live class receives a large surface. The rest of the day is deliberately compact.</p></div>
      <div class="phone"><div class="screen" id="screen">
        <div class="status"><span>9:41</span><span class="status-right">●●● &nbsp;◒ &nbsp;▰</span></div>
        <div class="app" id="app"></div>
        <nav class="tabbar" id="tabbar" aria-label="App navigation"></nav>
        <aside class="sheet" id="sheet" aria-live="polite"></aside>
        <div class="home-indicator"></div>
      </div></div>
    </section>
  </main>
  <script>
    const subjects = [
      { name: 'Computer Networks', attended: '29 / 34 attended', rate: '85.3%', note: '4 skips left', tone: 'mint' },
      { name: 'Database Systems', attended: '15 / 22 attended', rate: '68.2%', note: '12 to recover', tone: 'peach', risk: true },
      { name: 'Operating Systems', attended: '27 / 31 attended', rate: '87.1%', note: '5 skips left', tone: 'lilac' },
      { name: 'Design & Analysis', attended: '23 / 28 attended', rate: '82.1%', note: '2 skips left', tone: 'rose' }
    ];
    const app = document.querySelector('#app');
    const screen = document.querySelector('#screen');
    const tabbar = document.querySelector('#tabbar');
    const sheet = document.querySelector('#sheet');
    let page = 'home';

    const tab = active => `
      <button data-go="home" class="${active === 'home' ? 'active' : ''}">⌂<br>Today</button>
      <button data-go="attendance" class="${active === 'attendance' ? 'active' : ''}">⌁<br>Attendance</button>
      <button aria-label="Schedule">□<br>Schedule</button>
      <button aria-label="More options">···<br>More</button>`;

    function home() {
      return `
        <section class="page">
          <header class="top">
            <div><p>Thursday, 7 September</p><h2>Hi, Arjun</h2></div>
            <button class="avatar" aria-label="Your profile">AS</button>
          </header>
          <article class="live-card">
            <div class="live-card__head"><span class="live-pill"><i class="pulse"></i> LIVE NOW</span><span class="live-card__time">11:00 – 11:50</span></div>
            <h3>Database Systems</h3>
            <p>Unit 3 · Relational algebra</p>
            <div class="live-card__bottom"><span class="room">LT-105</span><button class="mark-present" data-mark>Mark present</button></div>
          </article>
          <div class="section-heading"><h3>Later today</h3><span>2 classes</span></div>
          <div class="bento">
            <button class="class-tile mint" data-detail="Computer Networks"><span class="tile-time">14:00</span><span class="tile-name">Computer<br>Networks</span><span class="tile-room">LT-204</span></button>
            <button class="class-tile peach" data-detail="Operating Systems"><span class="tile-time">16:00</span><span class="tile-name">Operating<br>Systems</span><span class="tile-room">LT-204</span></button>
          </div>
          <button class="snapshot" data-go="attendance"><span><p>Overall attendance</p><b>81.6%</b></span><span>On track →</span></button>
        </section>`;
    }

    function attendance() {
      return `
        <section class="page">
          <header class="attendance-top">
            <button class="back" data-go="home">‹ Today</button>
            <h2>Attendance</h2><p>A simple view of where you stand.</p>
          </header>
          <article class="overall"><span><small>OVERALL ATTENDANCE</small><strong>81.6%</strong></span><b class="overall__safe">Above 75%<br>by 6.6%</b></article>
          <div class="attendance-meta"><span>253 of 310 classes</span><span>updated today</span></div>
          <div class="section-heading"><h3>By subject</h3><span>Tap for detail</span></div>
          <div class="attendance-list">
            ${subjects.map(s => `<button class="attendance-row" data-detail="${s.name}">
              <i class="subject-dot ${s.tone}"></i><span class="subject-name"><b>${s.name}</b><span>${s.attended} · ${s.note}</span></span>
              <span class="rate ${s.risk ? 'risk' : ''}">${s.rate}<small>${s.risk ? 'needs care' : 'on track'}</small></span>
            </button>`).join('')}
          </div>
        </section>`;
    }

    function render() { app.innerHTML = page === 'home' ? home() : attendance(); tabbar.innerHTML = tab(page); sheet.classList.remove('open'); }
    function openDetail(name) {
      const subject = subjects.find(s => s.name === name) || { name, attended: 'In progress', rate: '—', note: 'Current class' };
      sheet.innerHTML = `<div class="grab"></div><h3>${subject.name}</h3><p>${subject.risk ? 'This subject needs a recovery plan.' : 'Your current buffer is healthy.'}</p>
        <div class="sheet-row"><span>Attendance</span><b>${subject.rate}</b></div><div class="sheet-row"><span>Classes</span><b>${subject.attended}</b></div>
        <div class="sheet-row"><span>Next decision</span><b>${subject.note}</b></div><button data-close>Close details</button>`;
      sheet.classList.add('open');
    }

    document.addEventListener('click', event => {
      const palette = event.target.closest('[data-palette]');
      if (palette) {
        screen.dataset.palette = palette.dataset.palette === 'lilac' ? '' : palette.dataset.palette;
        document.querySelectorAll('[data-palette]').forEach(button => button.setAttribute('aria-pressed', button === palette));
        return;
      }
      const go = event.target.closest('[data-go]');
      if (go) { page = go.dataset.go; render(); return; }
      const detail = event.target.closest('[data-detail]');
      if (detail) { openDetail(detail.dataset.detail); return; }
      if (event.target.closest('[data-close]')) { sheet.classList.remove('open'); return; }
      if (event.target.closest('[data-mark]')) { event.target.closest('[data-mark]').textContent = 'Marked present'; }
    });
    render();
  </script>
</body>
</html>
